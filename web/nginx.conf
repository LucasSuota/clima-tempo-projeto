server {
    listen 8080;
    root /usr/share/nginx/html;

    # add_header is not inherited by a block that sets its own, so it is repeated per location.

    # Same origin as the pages, like the Vite proxy in dev (AGENTS.md §5.4): no CORS needed.
    location /api/ {
        proxy_pass http://server:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these files, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }
}
